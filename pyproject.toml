[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-github-repo-scraper"
version = "0.1.0"
description = "GitHub repository search for Python and the command line: repositories for any query in GitHub search syntax, sorted by best match, stars or last update, with owner, description, language, stars, forks, topics, license and dates, as JSON or CSV. Free and open source; no GitHub token needed, sign in with your QuanticData account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["github-scraper", "github-repo-scraper", "github-repository-search", "github-repo-search", "github-search", "github-api", "github-stars", "repository-search", "open-source", "developer-tools", "market-research", "web-scraping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
github-repo-scraper = "quanticdata_github_repo_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/github-repository-search-api/?utm_source=github&utm_medium=pypi&utm_campaign=github-repo-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/github-repo-scraper"
Issues = "https://github.com/quantumproxies/github-repo-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_github_repo_scraper" = ["spec.json", "py.typed"]
